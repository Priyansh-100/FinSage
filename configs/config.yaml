# Main Hydra config - composes all sub-configs
defaults:
  - data: data
  - model: model
  - train: train
  - _self_

# Runtime settings
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  job:
    chdir: true

