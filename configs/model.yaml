# Model configuration for RNN/LSTM/BiLSTM
model:
  # Model type: "rnn", "lstm", "bilstm", "baseline"
  type: "lstm"
  
  # Embedding layer
  embedding:
    input_dim: 20000  # vocab size (set dynamically)
    output_dim: 128   # embedding dimension
    mask_zero: true
    trainable: true
  
  # RNN/LSTM layer(s)
  rnn:
    hidden_units: 128
    num_layers: 1
    bidirectional: false
    dropout: 0.3
    recurrent_dropout: 0.0
    return_sequences: false
  
  # Dense/Output layer
  dense:
    units: 3  # num classes
    activation: "softmax"
    dropout: 0.3
  
  # Baseline (TF-IDF + LR/SVM) settings
  baseline:
    tfidf:
      max_features: 10000
      ngram_range: [1, 2]
      min_df: 2
      max_df: 0.95
    classifier:
      type: "logistic_regression"  # or "svm"
      C: 1.0
      class_weight: "balanced"
      max_iter: 1000
      random_state: 42