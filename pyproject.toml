[project]
name = "finsage"
version = "0.1.0"
description = "Financial News Sentiment Classification Using Deep Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.15",
    "scikit-learn>=1.3",
    "pandas>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "hydra-core>=1.3",
    "mlflow>=2.8",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tqdm>=4.66",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.0",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
